<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stellare Industrien</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="planet-id">
      <div id="planetName">-</div>
      <div id="planetCoords" class="small">-</div>
    </div>
    <div class="resources">
      <div class="res-item"><span class="res-label">Metall</span><span id="metalTop">0</span><span class="rate" id="metalRate">0/h</span></div>
      <div class="res-item"><span class="res-label">Kristall</span><span id="crystalTop">0</span><span class="rate" id="crystalRate">0/h</span></div>
      <div class="res-item"><span class="res-label">Deuterium</span><span id="deutTop">0</span><span class="rate" id="deutRate">0/h</span></div>
      <div class="res-item"><span class="res-label">Energie</span><span id="energyTop">0</span><span class="rate" id="energyUse">0 genutzt</span></div>
    </div>
  </header>

  <nav id="nav"></nav>

  <div id="layout">
    <aside id="sidebar">
      <div class="side-block">
        <h4>Planeten</h4>
        <div id="planetTabs" class="planet-tabs"></div>
      </div>
      <div class="side-block">
        <h4>Aufträge</h4>
        <div id="queues" class="queue"></div>
      </div>
      <div class="side-block">
        <h4>Flottenbewegungen</h4>
        <div id="fleetMovements" class="queue"></div>
      </div>
      <div class="side-block">
        <h4>Ereignisse</h4>
        <div id="logs" class="logs"></div>
      </div>
    </aside>

    <main id="view"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
